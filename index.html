h:170px;height:210px;background:#c3d5a6;border-radius:50% 50% 45% 55%;right:-25px;top:68px;transform:rotate(-25deg);box-shadow:inset -32px -18px 40px #6a8652}.marker{position:absolute;right:12px;top:12px;background:var(--accent);color:#283421;border:0;border-radius:5px;padding:2px 7px;font-size:11px;z-index:2}.webpart{position:relative}.webpart.focused{outline:3px solid #b0d343;outline-offset:-3px}.websection{padding:28px;background:#e9e7db}.websection h3{font:32px Georgia,serif;line-height:1.05;margin:0 0 20px}.webgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shape{height:130px;background:#bdc7a7;display:grid;place-items:center;overflow:hidden}.vase{height:94px;width:57px;border-radius:30% 30% 43% 43%;background:linear-gradient(100deg,#8f593b,#d7a87b,#714834);transform:rotate(-12deg);box-shadow:15px 10px 18px #54554455}.shape:nth-child(2){background:#d5c0a6}.shape:nth-child(2) .vase{border-radius:50%;height:83px;width:83px;background:linear-gradient(110deg,#ebe3c8,#b3ae8c)}.webquote{padding:36px 25px;background:#c9d3ad;font:30px/1.2 Georgia,serif}.webfoot{padding:25px;background:#1e3026;color:#e4e8d6}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:6px 12px;font-size:12px;border-radius:6px;background:transparent}.chip.active{background:#e4e9d7;border-color:#c6d1b6;color:#3a5123}.results{display:flex;flex-direction:column;gap:12px}.fragment{border:1px solid var(--line);background:#fff;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:145px 1fr;position:relative;min-height:147px}.fragment.selected{border-color:#8ca448;box-shadow:0 0 0 1px #8ca448}.thumb{border:0;border-radius:0;min-height:145px;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;text-align:left}.thumb:hover{border:0}.mini{height:100%;width:100%;display:flex;flex-direction:column;justify-content:center;padding:18px;overflow:hidden}.mini strong{font:29px/.97 Georgia,serif;letter-spacing:-1px}.mini small{color:inherit;o d var(--line);background:white;border-radius:10px;overflow:hidden}.library-card .thumb{width:100%;height:210px}.library-card .mini{padding:27px}.library-card .mini strong{font-size:49px}.library-card .fragment-info{padding:17px}.library-card h3{font-size:15px;margin:0 0 8px}.lib-footer{margin-top:15px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}.lib-footer button{font-size:11px;padding:4px 8px}.empty{padding:70px 20px;text-align:center;color:#78836b;border:1px dashed #ccd3bf;border-radius:10px}.modal{position:fixed;inset:0;background:#14201288;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.dialog{background:#f9faf5;border-radius:16px;width:530px;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 30px 100px #0003}.dialog.wide{width:720px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dialog-head button{border:0;background:transparent;font-size:20px;padding:0 6px}.dialog .thumb{height:250px;width:100%;border-radius:8px;margin-bottom:20px}.dialog .mini strong{font-size:65px}.dialog label{display:block;font-size:12px;margin:17px 0 7px}.dialog input,.dialog select,.dialog textarea{width:100%;padding:10px;border:1px solid #d4dbc8;border-radius:7px;background:white}.dialog textarea{height:90px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.notice{font-size:11px;color:#838b78;margin-top:12px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#293723;color:white;padding:12px 22px;border-radius:8px;z-index:99;box-shadow:0 8px 30px #0002}.hidden{display:none!important}.mobile-menu{display:none}

</style></head><body>
<div class="app"><aside><div class="logo"><b>拾</b>拾形<small>DESIGN BREAKDOWN</small></div><nav><button data-view="results" class="active"><span>◫</span>网页拆解</button><button data-view="library"><span>▧</span>个人收藏库 <small id="total"></small></button></nav><div class="side-label">我的收藏夹</div><div id="folders"></div><button class="folder" id="newFolder">＋ 新建收藏夹</button><div class="account"><div class="avatar">L</div><div>灵感收集者<br><small>本地个人空间</small></div></div></aside>
<main><header class="topbar"><div id="breadcrumb">工作台 <span class="muted"> / 网页拆解</span></div><div class="status"><span class="dot"></span>真实网页拆解</div></header><div class="content">
<section id="results"><div class="heading"><div><h1>好设计，值得拆开看。</h1><p>从网页里发现细节，把喜欢的留给下一次创作。</p></div><div><button id="apiSettings">连接抓取服务</button> <button id="openImport">＋ 拆解网页</button></div></div><form class="urlbox" id="urlForm"><span>↗</span><input id="url" aria-label="网页地址" type="url" value="" placeholder="https://你喜欢的网站.com" required><span class="demo" id="apiStatus">未连接后端</span><button type="submit" class="primary" id="analyze">开始拆解</button></form>
<div class="workbench"><div class="preview-column"><div class="section-title"><h2>网页原貌</h2><small>点击编号，查看设计片段</small></div><div class="browser"><div class="browserbar"><i></i><i></i><i></i><span id="domain">等待输入网址</span></div><div class="webcanvas" id="webcanvas"><div class="empty" style="margin:22px"><h2>从一个喜欢的网页开始</h2><p>输入公开网址，获取页面截图和设计片段。</p></div></div></div><p class="notice" id="analysisNote" role="status">基于真实浏览器截图与页面结构分析。每次最多识别 16 个片段。</p></div>
<div><div class="section-title"><h2>发现 <span id="found">0</span> 个设计片段</h2><button class="chip" id="selectAll">全选当前结果</button></div><div class="filters" id="resultFilters"></div><div class="results" id="fragmentList"></div></div></div></section>
<section id="library" class="hidden"><div class="heading"><div><h1 id="libraryTitle">个人收藏库</h1><p>让每一次心动，成为下一次设计的起点。</p></div><button class="primary" data-view="results">＋ 收集新灵感</button></div><div class="collection-head"><div class="filters" id="libraryFilters"></div><input class="search" id="search" placeholder="搜索名称、标签、备注…" aria-label="搜索收藏"></div><div class="section-title"><small id="libraryCount"></small><select id="sort" aria-label="收藏排序"><option value="new">最近收藏</option><option value="name">按名称排序</option></select></div><div class="library-grid" id="libraryGrid"></div></section>
</div></main></div><div class="batch" id="batch"><div><span class="countbox" id="selectedCount">0</span>个片段已选</div><button class="clear" id="clear">取消选择</button><button class="lime" id="saveSelected" disabled>收藏所选 ↗</button></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const legacyItems=[
{id:0,name:'自然主义大字体首屏',type:'布局',desc:'衬线大字与有机造型叠放，用留白建立阅读节奏。',tags:['首屏','自然主义','衬线字体'],art:'hero',headline:'Less, but<br>closer to nature.',sub:'OBJECTS FOR A SLOWER LIFE'},
{id:1,name:'极简横向导航',type:'导航',desc:'品牌与功能分置两端，让导航安静地融入页面。',tags:['导航','极简','低干扰'],art:'nav',headline:'forma®',sub:'Objects　 About　 Bag (0)'},
{id:2,name:'陶土质感作品卡片',type:'组件',desc:'柔和背景衬托立体器物，以材质与轮廓建立焦点。',tags:['卡片','材质','作品展示'],art:'card',headline:'Earth collection',sub:'CONSIDERED OBJECTS'},
{id:3,name:'编辑式宣言排版',type:'排版',desc:'短句分行与大字号组合，在内容之间制造停顿。',tags:['大字体','编辑式','留白'],art:'type',headline:'Good things<br>take their time.',sub:'A LITTLE LESS. A LITTLE BETTER.'},
{id:4,name:'箭头引导胶囊按钮',type:'交互',desc:'悬停时箭头区域产生轻微位移，强化下一步操作。',tags:['按钮','悬停','微交互'],art:'button',headline:'Explore the collection ↗',sub:'悬停预览 · 原型示意'},
{id:5,name:'深色引言区块',type:'排版',desc:'用深浅色块切换节奏，让品牌观点从页面中浮现。',tags:['引言','色彩对比','品牌表达'],art:'quote',headline:'Designed<br>to stay.',sub:'NOT TO STAND OUT.'}
];
let items=[];const getItem=id=>items.find(x=>x.id===id)||state.saved.find(x=>x.id===id)?.item;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={folders:['日常灵感','品牌网站','交互细节'],saved:[]};
let db,saveQueue=Promise.resolve(),lastFocus;
const dbReady=new Promise((resolve,reject)=>{const r=indexedDB.open('shixing-library',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)});
async function initState(){try{await dbReady;const cached=await new Promise((resolve,reject)=>{const r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(cached)state=cached;else{try{const old=JSON.parse(localStorage.getItem('shixing-v1'));if(old?.folders?.length&&Array.isArray(old.saved)){state={folders:old.folders,saved:old.saved.map(s=>({...s,item:{...legacyItems[s.id],demo:true},source:'历史演示素材'})).filter(s=>s.item.name)};await persist()}}catch{}}render()}catch{toast('收藏存储无法打开，请允许此网站使用浏览器存储。')}}
let view='results',filter='全部',libFilter='全部',folder='',selected=new Set(),source='',busy=false,capture=null;
function persist(){const snapshot=structuredClone(state);saveQueue=saveQueue.catch(()=>{}).then(async()=>{await dbReady;await new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite');tx.objectStore('state').put(snapshot,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})});return saveQueue}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hidden'),2800)}
function art(x){if(x.image)return '<img loading="lazy" alt="'+esc(x.name)+'截图" src="'+esc(x.image)+'">';return '<div class="mini art-'+x.art+'">'+(x.art==='card'?'<div class="vase"></div>':x.art==='button'?'<span class="pill">'+x.headline+'</span>':x.art==='nav'?'<strong>'+x.headline+'</strong><div class="navlines"><span>Objects</span><span>About ↗</span></div>':'<strong>'+x.headline+'</strong>')+'<small>'+x.sub+'</small></div>'}
function chips(target,current){$(target).innerHTML=['全部','布局','导航','组件','排版','交互'].map(t=>'<button class="chip '+(t===current?'active':'')+'" data-filter="'+t+'">'+t+'</button>').join('')}
function render(){chips('#resultFilters',filter);chips('#libraryFilters',libFilter);$('#total').textContent=state.saved.length;$('#folders').innerHTML=state.folders.map(f=>'<button class="folder '+(folder===f?'chosen':'')+'" data-folder="'+esc(f)+'"><span>▱ '+esc(f)+'</span><small>'+state.saved.filter(s=>s.folder===f).length+'</small></button>').join('');
const visible=items.filter(x=>filter==='全部'||x.type===filter);$('#found').textContent=visible.length;
$('#fragmentList').innerHTML=visible.map(x=>'<article class="fragment '+(selected.has(x.id)?'selected':'')+'"><button class="thumb" data-detail="'+x.id+'" aria-label="查看'+esc(x.name)+'">'+art(x)+'</button><div class="fragment-info"><div class="meta"><span>'+String(items.indexOf(x)+1).padStart(2,'0')+' / '+esc(x.type)+'</span>'+(state.saved.some(s=>s.id===x.id)?'<span class="saved-label">✓ 已收藏</span>':'')+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.desc)+'</p><div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div><input class="check" type="checkbox" aria-label="选择'+esc(x.name)+'" data-select="'+x.id+'" '+(selected.has(x.id)?'checked':'')+'></article>').join('')||'<div class="empty">输入网页地址后，这里会展示识别到的设计片段。</div>';
$('#selectedCount').textContent=selected.size;$('#saveSelected').disabled=!selected.size;renderLibrary()}
function renderLibrary(){const q=$('#search').value.trim().toLowerCase();let saved=state.saved.filter(s=>{const x=getItem(s.id);return x&&(!folder||folder===s.folder)&&(libFilter==='全部'||x.type===libFilter)&&[x.name,...x.tags,s.note,s.folder].join(' ').toLowerCase().includes(q)});saved.sort((a,b)=>$('#sort').value==='name'?getItem(a.id).name.localeCompare(getItem(b.id).name,'zh'):b.at-a.at);$('#libraryTitle').textContent=folder||'个人收藏库';$('#libraryCount').textContent=saved.length+' 个设计片段 · 保存在当前浏览器';
$('#libraryGrid').innerHTML=saved.length?saved.map(s=>{const x=getItem(s.id);return '<article class="library-card"><button class="thumb" data-detail="'+x.id+'" aria-label="查看'+esc(x.name)+'">'+art(x)+'</button><div class="fragment-info"><h3>'+esc(x.name)+'</h3><div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><p style="margin-top:12px">'+esc(s.note||'还没有备注，记下让你心动的细节。')+'</p><div class="lib-footer"><small>▱ '+esc(s.folder)+'</small><button data-detail="'+x.id+'">查看 / 编辑 ↗</button></div></div></article>'}).join(''):'<div class="empty" style="grid-column:1/-1"><h2>这里还没有设计片段</h2><p>试试其他筛选条件，或去拆解页收藏新的灵感。</p><button data-view="results">去挑选设计片段 ↗</button></div>'}
function setView(v){view=v;$('#results').classList.toggle('hidden',v!=='results');$('#library').classList.toggle('hidden',v!=='library');$('#batch').classList.toggle('hidden',v!=='results');document.querySelectorAll('nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#breadcrumb').innerHTML='工作台 <span class="muted"> / '+(v==='results'?'网页拆解':'个人收藏库')+'</span>';history.replaceState(null,'','#'+v);render()}
function modal(title,body,wide=false){lastFocus=document.activeElement;$('#modal').innerHTML='<div class="dialog '+(wide?'wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="dialog-head"><h2>'+esc(title)+'</h2><button data-close aria-label="关闭">×</button></div>'+body+'</div>';$('#modal').classList.remove('hidden');document.body.style.overflow='hidden';setTimeout(()=>$('#modal').querySelector('input,select,textarea,button').focus(),0)}
function closeModal(){$('#modal').classList.add('hidden');document.body.style.overflow='';lastFocus?.focus?.()}
function options(current){return state.folders.map(f=>'<option '+(f===current?'selected':'')+'>'+esc(f)+'</option>').join('')}
function saveDialog(){modal('收藏 '+selected.size+' 个设计片段','<p class="muted">把这一刻的灵感，放进你的设计资料库。</p><label for="saveFolder">收藏到</label><select id="saveFolder">'+options(state.folders[0])+'</select><label for="saveNote">备注（可选）</label><textarea id="saveNote" placeholder="例如：下一个品牌项目的排版参考"></textarea><p class="notice">已收藏的片段将更新收藏夹；空备注保留原有内容。</p><div class="dialog-actions"><button data-close>取消</button><button class="primary" id="confirmSave">确认收藏</button></div>')}
function detail(id){const x=getItem(id);if(!x)return;const s=state.saved.find(s=>s.id===id);modal(x.name,'<div class="thumb">'+art(x)+'</div>'+(x.style?'<div class="style-details">'+Object.entries(x.style).map(([k,v])=>'<div>'+esc(k)+'：'+esc(v)+'</div>').join('')+'</div>':'')+'<div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><p style="margin-top:15px">'+esc(x.desc)+'</p><p class="notice">来源：'+esc(s?.source||x.source||source)+(x.demo?' · 历史演示素材':' · '+esc(x.capturedAt||''))+'</p>'+(s?'<label for="editFolder">收藏夹</label><select id="editFolder">'+options(s.folder)+'</select><label for="editNote">我的备注</label><textarea id="editNote">'+esc(s.note)+'</textarea><div class="dialog-actions"><button data-remove="'+id+'">移出收藏</button><button class="primary" data-update="'+id+'">保存更改</button></div>':'<div class="dialog-actions"><button data-locate="'+id+'">在原网页中定位</button><button class="primary" data-add="'+id+'">收藏这个片段</button></div>'),true)}
function locate(id){const x=getItem(id);if(!capture||!items.some(i=>i.id===id))return toast('该片段来自历史抓取。请重新抓取来源网址查看整页定位。');setView('results');const frame=$('#webcanvas'),preview=frame.querySelector('.capture');preview.querySelector('.preview-target')?.remove();const target=document.createElement('div');target.className='preview-target';target.style.top=(x.rect.y/capture.height*100)+'%';target.style.height=(x.rect.height/capture.height*100)+'%';preview.append(target);frame.scrollTop=x.rect.y/capture.width*preview.clientWidth;toast('已定位：'+x.name)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))closeModal();if(b.dataset.view){folder='';setView(b.dataset.view)}if(b.dataset.folder!==undefined){folder=b.dataset.folder;setView('library')}if(b.dataset.filter){if(b.closest('#resultFilters'))filter=b.dataset.filter;else libFilter=b.dataset.filter;render()}if(b.dataset.detail!==undefined)detail(+b.dataset.detail);if(b.dataset.focus!==undefined)detail(+b.dataset.focus);if(b.dataset.locate!==undefined){closeModal();locate(+b.dataset.locate)}if(b.dataset.add!==undefined){selected=new Set([+b.dataset.add]);render();saveDialog()}if(b.dataset.update!==undefined){const s=state.saved.find(s=>s.id===+b.dataset.update);s.folder=$('#editFolder').value;s.note=$('#editNote').value;try{await persist();closeModal();render();toast('收藏已更新')}catch{toast('保存失败，请检查浏览器存储空间。')}}if(b.dataset.remove!==undefined){const id=+b.dataset.remove;modal('移出收藏？','<p>将从个人收藏库移除「'+esc(getItem(id).name)+'」，仍可在拆解结果中重新收藏。</p><div class="dialog-actions"><button data-close>取消</button><button class="primary" data-confirm-remove="'+id+'">确认移除</button></div>')}if(b.dataset.confirmRemove!==undefined){state.saved=state.saved.filter(s=>s.id!==+b.dataset.confirmRemove);try{await persist();closeModal();render();toast('已移出收藏')}catch{toast('移除未能保存，请重试。')}}});
document.addEventListener('change',e=>{if(e.target.dataset.select!==undefined){const id=+e.target.dataset.select;e.target.checked?selected.add(id):selected.delete(id);render()}});
$('#selectAll').onclick=()=>{const a=items.filter(x=>filter==='全部'||x.type===filter);if(a.every(x=>selected.has(x.id)))a.forEach(x=>selected.delete(x.id));else a.forEach(x=>selected.add(x.id));render()};
$('#clear').onclick=()=>{selected.clear();render()};$('#saveSelected').onclick=saveDialog;
$('#modal').addEventListener('click',async e=>{if(e.target===$('#modal'))closeModal();if(e.target.id==='confirmSave'){const f=$('#saveFolder').value,n=$('#saveNote').value;const count=selected.size;selected.forEach(id=>{const s=state.saved.find(s=>s.id===id);if(s){s.folder=f;if(n)s.note=n}else state.saved.push({id,folder:f,note:n,at:Date.now(),source:getItem(id).source||source,item:structuredClone(getItem(id))})});try{await persist();selected.clear();closeModal();render();toast(count+' 个设计片段已保存到「'+f+'」')}catch{toast('保存失败，请检查浏览器存储空间后重试。')}}if(e.target.id==='confirmFolder'){const name=$('#folderName').value.trim();if(!name)return toast('请输入收藏夹名称');if(state.folders.includes(name))return toast('这个收藏夹已经存在');state.folders.push(name);try{await persist();closeModal();render();toast('收藏夹已创建')}catch{toast('收藏夹保存失败，请重试。')}}});
$('#newFolder').onclick=()=>modal('新建收藏夹','<label for="folderName">收藏夹名称</label><input id="folderName" maxlength="24" placeholder="例如：下一个品牌项目"><div class="dialog-actions"><button data-close>取消</button><button class="primary" id="confirmFolder">创建收藏夹</button></div>');
$('#search').oninput=renderLibrary;$('#sort').onchange=renderLibrary;
function apiBase(){return (localStorage.getItem('shixing-api')||((['localhost','127.0.0.1'].includes(location.hostname)||location.hostname.endsWith('.onrender.com'))?location.origin:'')).replace(/\/$/,'')}
function updateApiStatus(){$('#apiStatus').textContent=apiBase()?'后端已配置':'未连接后端';$('#apiSettings').textContent=apiBase()?'抓取服务设置':'连接抓取服务'}
function apiDialog(){modal('连接 Render 抓取服务','<p class="muted">填写 Render 部署成功后提供的服务地址。服务会真实访问你提交的公开网址。</p><label for="apiUrl">服务地址</label><input id="apiUrl" type="url" placeholder="https://你的服务名.onrender.com" value="'+esc(apiBase())+'"><p class="notice">Render 免费服务休眠后首次启动可能需要一分钟。HTTPS 网站需要连接 HTTPS 服务。</p><div class="dialog-actions"><button data-close>取消</button><button class="primary" id="confirmApi">检测并保存</button></div>')}
$('#apiSettings').onclick=apiDialog;
document.addEventListener('click',async e=>{if(e.target.id!=='confirmApi')return;let u;try{u=new URL($('#apiUrl').value);if(u.protocol!=='https:'&&!(['localhost','127.0.0.1'].includes(u.hostname)&&u.protocol==='http:'))throw 0;if(u.username||u.password)throw 0}catch{return toast('请填写 HTTPS 服务地址。')}const button=e.target;button.disabled=true;button.textContent='正在连接…';try{const r=await fetch(u.origin+'/health',{signal:AbortSignal.timeout(90000)});const d=await r.json();if(!r.ok||d.service!=='designbreakdown')throw new Error('不是有效的抓取服务');localStorage.setItem('shixing-api',u.origin);updateApiStatus();closeModal();toast('已连接真实抓取服务')}catch{toast('连接失败，请检查服务状态、地址和允许访问的来源。');button.disabled=false;button.textContent='检测并保存'}});
async function analyze(url){if(busy)return;let u;try{u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw 0}catch{return toast('请输入完整的 http 或 https 网页地址')}if(!apiBase())return apiDialog();
busy=true;$('#url').value=u.href;$('#analyze').disabled=true;$('#analyze').textContent='正在抓取…';$('#analysisNote').classList.remove('error-msg');$('#analysisNote').textContent='正在启动真实浏览器、加载网页并截图。通常需要 15–60 秒；休眠服务可能更久。';
try{const response=await fetch(apiBase()+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u.href}),signal:AbortSignal.timeout(180000)});const data=await response.json();if(!response.ok)throw new Error(data.error||'抓取失败');if(!Array.isArray(data.fragments)||!data.screenshot)throw new Error('服务返回结果不完整');
source=data.source;capture=data;items=data.fragments;selected.clear();filter='全部';$('#domain').textContent=data.title+' · '+new URL(data.source).hostname;
$('#webcanvas').innerHTML='<div class="capture"><img alt="抓取的网页截图" src="'+esc(data.screenshot)+'">'+items.map((x,i)=>'<button class="marker" style="top:'+Math.max(1,x.rect.y/data.height*100)+'%" data-focus="'+x.id+'">'+String(i+1).padStart(2,'0')+'</button>').join('')+'</div>';
$('#analysisNote').textContent='已抓取 '+items.length+' 个片段。'+data.method+(data.truncated?' 超长网页仅分析前 14000 像素。':'');
$('#analyze').textContent='重新拆解';setView('results');toast('真实抓取完成，发现 '+items.length+' 个片段');
}catch(error){$('#analysisNote').classList.add('error-msg');$('#analysisNote').textContent='抓取失败：'+(error.name==='TimeoutError'?'服务启动或抓取超时，请稍后重试。':error.message==='Failed to fetch'?'无法连接抓取服务，请检查 Render 服务状态和后端地址。':error.message);toast('抓取失败，原有结果已保留。')}
finally{busy=false;$('#analyze').disabled=false;$('#analyze').textContent=items.length?'重新拆解':'开始拆解'}}
$('#urlForm').onsubmit=e=>{e.preventDefault();analyze($('#url').value)};
$('#openImport').onclick=()=>modal('拆解一个新网页','<p class="muted">粘贴你觉得设计不错的网页地址。</p><label for="importUrl">网页地址</label><input id="importUrl" type="url" placeholder="https://"><p class="notice">仅支持无需登录的公开网页。无法自动绕过人机验证。</p><div class="dialog-actions"><button data-close>取消</button><button class="primary" id="startImport">开始拆解</button></div>');
document.addEventListener('click',e=>{if(e.target.id==='startImport'){const v=$('#importUrl').value;try{const u=new URL(v);if(!['http:','https:'].includes(u.protocol))throw 0;closeModal();analyze(v)}catch{toast('请输入完整的 http 或 https 网页地址')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('#modal').classList.contains('hidden')){const list=[...$('#modal').querySelectorAll('button,input,textarea,select')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
setView(location.hash==='#library'?'library':'results');updateApiStatus();initState();
</script></body></html>
