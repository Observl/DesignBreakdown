<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾形抓取 API 验证</title><style>body{font:16px/1.7 system-ui;max-width:900px;margin:45px auto;padding:20px;background:#f5f6ef;color:#253021}input,button{font:inherit;padding:12px;border:1px solid #b4bea5;border-radius:7px}input{width:65%}button{background:#d8f36a;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}img{max-width:100%;border:1px solid #ccc}article{background:white;padding:15px;margin:15px 0}small{color:#68745e}</style><h1>拾形 · 真实网页抓取</h1><p>提交公开网址，检查 EdgeOne 云端浏览器是否能生成截图和设计片段。</p><form id="form"><input id="url" aria-label="网页地址" type="url" required value="https://www.python.org/"><button id="submit">开始抓取</button></form><pre id="status" role="status">等待请求。</pre><div id="results"></div><script>
const form=document.querySelector('#form'),status=document.querySelector('#status'),button=document.querySelector('#submit'),results=document.querySelector('#results');
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;results.replaceChildren();status.textContent='正在调用云端 Chromium，最长等待 120 秒…';try{const endpoint=new URL('/api/analyze',location.origin);endpoint.search=location.search;const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value}),signal:AbortSignal.timeout(125000)});const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error('HTTP '+response.status+'：服务未返回 JSON，请检查域名预览认证。')}if(!response.ok)throw new Error('HTTP '+response.status+'：'+data.error);status.textContent=JSON.stringify({status:response.status,title:data.title,source:data.source,fragments:data.fragments.length,screenshotBytes:data.screenshot.length,method:data.method},null,2);for(const fragment of data.fragments){const article=document.createElement('article'),title=document.createElement('h2'),desc=document.createElement('p'),image=document.createElement('img');title.textContent=fragment.name+' · '+fragment.type;desc.textContent=fragment.desc;image.src=fragment.image;image.alt=fragment.name+'截图';article.append(title,desc,image);results.append(article)}}catch(error){status.textContent='抓取失败：'+error.message}finally{button.disabled=false}};
</script></html>
